[space-location-description]
electria=Statyka? Elektryczność? Energia? Być może o to właśnie chodzi.
neo-nauvis=Podobna do Nauvis, ale nie do końca...
produstia=Wszędzie pachnie ropą. Maszyny montażowe, automatyka, wszystko to, do czego jesteś przyzwyczajony, ale w jednym (innym) miejscu.
smeltus=Górnictwo, hutnictwo, prawie jak planeta dla krasnoludów.

