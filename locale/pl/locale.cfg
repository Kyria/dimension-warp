dw-factory-beacon-6=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
dw-factory-beacon-7=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
dw-hidden-gate-pole=Do tego słupa należy podłączyć wyłącznie zasilanie.\n\n[img=virtual-signal.signal-alert] Sygnały logiczne nie są tutaj przekazywane do innych powierzchni.
