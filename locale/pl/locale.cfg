[entity-description]
dimension-crane-jellynut=Wieża rolnicza wymiarowa dedykowana żeloorzechowi.\n\nAutomatycznie pobiera nasiona ze skrzyni z nasionami żeloorzecha w Smeltusie.\nAutomatycznie transportuje zebrane owoce do skrzyni żeloorzecha w Smeltusie.\nAutomatycznie pobiera prąd z powierzchni Smeltusa.
dimension-crane-yumako=Wieża rolnicza wymiarowa dedykowana pychotce.\ n\nAutomatycznie pobiera nasiona ze skrzyni nasion pychotki w Smeltusie.\nAutomatycznie transportuje zebrane owoce do skrzyni pychotki w Smeltusie.\nAutomatycznie pobiera prąd z powierzchni Smeltusa.
dw-crane-jellynut-output=Wszelkie produkty żeloorzecha wygenerowane przez umieszczoną [entity=dimension-crane-jellynut] zostaną przeniesione tutaj.
dw-crane-jellynut-seed-input=Wszelkie nasiona żeloorzecha znajdujące się w tej skrzyni zostaną automatycznie przeniesione do dowolnego umieszczonego [entity=dimension-crane-jellynut]
dw-crane-yumako-output=Wszelkie produkty pychotki wytworzone przez umieszczonego [entity=dimension-crane-yumako] zostaną przeniesione tutaj.
dw-crane-yumako-seed-input=Wszelkie nasiona pychotki znajdujące się w tej skrzyni zostaną automatycznie przeniesione do dowolnego umieszczonego [entity=dimension-crane-yumako]
dw-factory-beacon-1=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
dw-factory-beacon-2=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
dw-factory-beacon-3=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
dw-factory-beacon-4=Można używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.
