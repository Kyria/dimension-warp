dw-logistic-chest-output=Skrzynie: Domyślny typ skrzyni do wyjmowania między wymiarami
dw-manual-warp-max-time=Teleportacja: Maksymalny czas ręcznego skoku
dw-manual-warp-zone-multiplier=Teleportacja: Współczynnik czasu strefy skoku
dw-min-warp-voter=Teleportacja: Minimalny próg głosów wymaganych do skoku

[mod-setting-description]
dw-adjust-space-cost=Tylko w Space Age.\nDostosuj koszty części rakietowych, platform kosmicznych i budynków za pomocą mnożnika, ponieważ przestrzeń kosmiczna pozwala na nieograniczone generowanie zasobów.
dw-adjust-spoilage=Włącz dostosowania mechaniki psucia się przedmiotów, aby uzyskać bardziej dostosowane wrażenia z gry.
dw-adjust-stack-size=Automatycznie dostosuj rozmiary stosów przedmiotów, aby lepiej pasowały do rozgrywki i ograniczeń modu.
dw-another-mod-loader-select=Mod, z którego będą uzyte ładowarki.
dw-another-mod-loader=Jeśli zaznaczone, mod będzie zamiast tego używał ładowarek z określonego modu, wraz z ich charakterystyką.\n\nJeśli żaden z modów nie jest obecny lub został nieprawidłowo wybrany, nastąpi powrót do innego modu lub domyślnego ustawienia tego modu.
dw-debug=Tryb debugowania do testowania modu. Pozostaw to wyłączone, chyba że musisz coś przetestować.
dw-default-tile-dimensions=Domyślna płytka używana dla platform we wszystkich innych wymiarach. Domyślnie ustawiona na „tutorial-grid”, jeśli nie ustawiono.
dw-default-tile-platform=Domyślna płytka używana dla platformy powierzchniowej. Domyślnie ustawiona na „concrete”, jeśli nie ustawiono.
dw-helper-enemy-force-attack=Zapobiega atakowi sił wroga przed określoną liczbą skoków. Ustaw na 1 tylko dla pierwszej strefy. Nie zapobiega atakom spowodowanym zanieczyszczeniem.
dw-helper-pollution-multiplier=Regulacja poziomu zanieczyszczenia emitowanego przez platformę (domyślnie 100%). Nie wpływa na zanieczyszczenie emitowane przez jednostki.
dw-helper-starter-item=Zapewnienie początkowego wyposażenia (zbroja wspomagana, drony, bateria i tarcza). Jeśli w momencie przyznania tego wyposażenia gracz ma już założoną zbroję, poprzednia zostanie przeniesiona do ekwipunku gracza.
dw-logistic-chest-input=Typ skrzyni używanej jako wejście między wymiarami. Jeśli nie istnieje, domyślnie jest to „skrzynia ządająca.
dw-logistic-chest-output=Typ skrzyni używanej jako wyjście między wymiarami. Jeśli nie istnieje, domyślnie jest to „skrzynia aktywnego dostawcy”.
dw-manual-warp-max-time=Maksymalny czas (w minutach) dozwolony dla odliczania ręcznego skoku.
dw-manual-warp-zone-multiplier=Mnożnik czasu dodawany do odliczania skoku dla każdego poziomu strefy teleportacji (poziom * mnożnik, w sekundach).
dw-min-warp-voter=Minimalny procent graczy wymagany do zainicjowania skoku. (0,1 = 10%, 1 = 100%)

[shortcut-name]
harvester-left-shortcut=Rozmieść lewą kopalnię
harvester-right-shortcut=Rozmieść prawą kopalnię
warp-gate-shortcut=Mobilna brama
