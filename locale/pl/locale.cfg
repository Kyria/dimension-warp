[technology-description]
dimension-crane-chest=Odblokuj skrzynie rolnicze w Smeltusie dla wież rolniczych wymiarowych.
dimension-crane=Odblokuj wieże rolnicze wymiarowe przeznaczone do konkretnych nasion. Wieże te automatycznie wysyłają owoce / pobierają nasiona z bazy oraz pobierają prąd z bazy.
dimension-harvester-left=Rozmieść moduł kopalni po lewej stronie.\n\n[img=virtual-signal.signal-alert] Wydobycie uranu jest wymagane do umieszczenia wiertnic górniczych w pomieszczeniach.
dimension-harvester-right=Rozmieść moduł kopalni po prawej stronie.\n\n[img=virtual-signal.signal-alert] Wydobycie uranu jest wymagane do umieszczenia wiertnic górniczych w pomieszczeniach.
dimension-inserter-capacity=Pozwala podanikom przenosić więcej przedmiotów jednocześnie.
dimension-mining-productivity=Zwiększa wydajność wszystkich wiertnic i kiwonów.
dimension-physical-projectile-damage=Zwiększa obrażenia zadawane przez broń opartą na pociskach, wieżyczki i roboty obronne.
dimension-steel-axe=Zwiększa prędkość wydobycia.
dimension-tesla-weapons-damage=Zwiększa obrażenia zadawane przez broń tesla i wieżyczki.
dimension-toolbelt=Zwiększa pojemność ekwipunku.
dimension-worker-robots-speed=Zwiększa prędkość lotu robotów logistycznych i budowlanych.
dimension-worker-robots-storage=Zwiększa liczbę przedmiotów, które roboty logistyczne i budowlane mogą przenosić jednocześnie.
dw-advanced-loader-stairs=Zmień ładowarkę platformową na zaawansowaną.
dw-express-loader-stairs=Zmień ładowarkę platformową na ekspresową.
dw-factory-beacon-1=Włącz nadajnik fabryczny (moduły: 3, zasięg: 8).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (10MW)!
dw-factory-beacon-2=Ulepsz nadajnik fabryczny (moduły: 4, zasięg: 16).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (20MW)!
dw-factory-beacon-3=Ulepsz nadajnik fabryczny (moduły: 5, zasięg: 26).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (40MW)!
dw-factory-beacon-4=Ulepsz nadajnik fabryczny (moduły: 6, zasięg: 36).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (80MW)!
dw-factory-beacon-5=Ulepsz nadajnik fabryczny (moduły: 8, zasięg: 47).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (100MW)!
dw-factory-beacon-6=Ulepsz nadajnik fabryczny (moduły: 10, zasięg: 57).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (200MW)!
dw-factory-beacon-7=Ulepsz nadajnik fabryczny (moduły: 15, zasięg: 64).\nMożna używać wszystkich modułów (Prędkość, Wydajność, Produktywność, Jakość)\nWydajność modułu: x2.\n\n[img=virtual-signal.signal-alert] Wysokie zużycie energii (500MW)!
dw-fast-loader-stairs=Zmień ładowarkę platformową na szybką.
dw-loader-stairs=Zmień ładowarkę platformową na ładowarkę.
dw-number-stairs-advanced=Zwiększ liczbę ładowarek między platformami.
dw-number-stairs-superior=Zwiększ liczbę ładowarek między platformami.
dw-stair-logistic-chest=Zmień skrzynie między platformami na skrzynie logistyczne (konfigurowalne w ustawieniach).
dw-superior-loader-stairs=Ulepsz ładowarkę platformową do ładowarki nadrzędnej.
dw-turbo-loader-stairs=Ulepsz ładowarkę platformową do ładowarki turbo.
dw-warp-gate=Włącz [img=entity.warp-gate] Bramę teleportacyjną i [img=entity.mobile-gate-1] Bramę mobilną.\n\nKażdy poziom poprawia przepływ energii między platformową [img=entity.warp-gate] Bramą teleportacyjną a [img=entity.mobile-gate-1] Bramą mobilną.
electrified-ground=Stwórz zelektryfikowaną powierzchnię, aby zasilać wszystkie swoje konstrukcje bez słupów energetycznych na różnych platformach.\nNie obejmuje platformy powierzchniowej.\n[img=virtual-signal.signal-alert] Wymagane do przesyłania energii między powierzchniami.
factory-platform-upgrade=Zwiększ rozmiar platformy Produstia.
factory-platform=Udziel dostępu do platformy Produstia.\n\n[img=virtual-signal.signal-alert] Platforma nie będzie miała energii, dopóki nie zbadasz Platformowych Zelektryfikowanych Podłoży.
mining-platform-upgrade=Zwiększ rozmiar platformy Smeltus.
mining-platform=Udziel dostępu do platformy Smeltus.\n\n[img=virtual-signal.signal-alert] Platforma nie będzie miała zasilania, dopóki nie zbadasz Platformowych Zelektryfikowanych Podłoży.
platform-radar=Włącz radar wewnątrz wieży radiowej\n\n[img=virtual-signal.signal-alert] Emituj zanieczyszczenia na każdej platformie.
power-platform-upgrade=Zwiększ rozmiar platformy Electria.
power-platform-water=Odblokuj dostęp do wody na powierzchni Electrii.
power-platform=Udziel dostępu do platformy Electria.\n\n[img=virtual-signal.signal-alert] Platforma nie będzie miała energii, dopóki nie zbadasz Platformowych Zelektryfikowanych Podłoży.
warp-generator-efficiency=Popraw wydajność generatora skoku międzywymiarowego (+10 min przed automatycznym skokiem).
warp-generator=Odblokuj nowe funkcje w swoim wymiarze laboratoriów.
warp-platform-size=Zwiększ rozmiar platformy teleportacyjnej.
warp-preferred-planet=Odblokuj możliwość ustawienia preferowanego miejsca docelowego skoku (prawdopodobieństwo powodzenia teleportacji nie wynosi 100%).

