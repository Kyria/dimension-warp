[dw-messages]
cannot-build-crane=Nie można tu zbudować wieży rolniczej wymiarowej. Dozwolone jest budowanie wyłącznie na powierzchni.
cannot-build-harvester=Nie można tu zbudować kopalni. Dozwolone jest budowanie wyłącznie na powierzchni.
cannot-build-mobile-gate=Nie można tu zbudować [img=entity.mobile-gate-1] ruchomej bramy. Dozwolone jest budowanie wyłącznie na powierzchni.
cannot-build-silo-cargo=Nie można budować w tym miejscu. Dozwolone jest budowanie wyłącznie na [planet=produstia] Produstii.
electrified-ground=W końcu znalazłeś dźwignię. Wszystkie światła są włączone, prąd płynie, wszystko działa idealnie... prawie...
factory-unlocked=Odblokowałeś drogę do nowego piętra. Tam na dole jest ciemno, być może potrzebujesz jeszcze czegoś, aby w pełni je uruchomić.
forbidden-buildable-area=[img=virtual-signal.signal-deny] [color=#f3a807][font=default-bold]Obszar zabroniony:[/font] __1__[/color]
gui-button-tooltip=Przełącz panel przenoszenia między wymiarami
gui-watchitem-tooltip=Przełącz panel obserwacji przedmiotów przenoszenia między wymiarami
harvester-deployable-collision=Nie można tu zbudować kopalni. W obszarze znajduje się inny obiekt do umieszczenia.
intro-explosion=[img=virtual-signal.signal-alert]Wybuch zniszczył wszystko!\nPojawił się dziwny portal [img=item.lab].\n\nPromieniowanie Ci szkodzi, a pobliskie kąsacze [img=entity.behemoth-biter] skupiają się w rój, zwabione przez wybuch.\n[color=red]Uciekaj natychmiast![/color]
intro-new-dimension-start=Trafiłeś do dziwnego, nowego miejsca — innego wymiaru?\nMiejsce to wydaje się znajome, jakby było twoim własnym, ale z czasów jego początków.\n\nNa razie wydaje się być wyłączone.
intro=[img=virtual-signal.signal-alert]Twoje badania są niestabilne! Tracisz kontrolę!
mining-unlocked=Odblokowano nowe piętro! Jest gorąco i czuć zapach spalin. Jednak ciemność nadal panuje.
mobile-gate-entities-present=Nie można zbudować urządzeń Mobilnej Bramy. Na drodze znajduje się gracz lub wrogi obiekt.
mobile-gate-other-deployable=Nie można zbudować urządzeń Mobilnej Bramy. W okolicy znajduje się inny obiekt.
power-unlocked=Ostatnie piętro jest teraz dostępne, wilgoć jest na całym piętrze. Ciemność nadal panuje, trzeba coś z tym zrobić...
restricted-buildable-area=[img=virtual-signal.signal-check] [color=#f3a807][font=default-bold]Obszar, na którym można budować:[/font] __1__[/color]
warp-generator-1=Po kilku próbach generator słabo ożywa, ale pojawia się odliczanie. Czujesz zapach zanieczyszczenia i wyczuwasz niebezpieczeństwo!\nStań na platformie, zanim licznik osiągnie zero!
rampant-settings=[img=virtual-signal.signal-alert] [font=default-bold]Wykryto RampantFixed.[/font] Pamiętaj, aby skonfigurować przetwarzanie planety zgodnie z opisem na stronie modu Dimension Warp.
warp-no-teleport=Nie możesz teleportować się na powierzchnię podczas skoku między wymiarami. Spróbuj ponownie za kilka sekund.

[dw-warning]
rampant-surface-not-active=[img=virtual-signal.signal-alert] Powierzchnia __1__ nie jest aktywna. Upewnij się, że wszystkie powierzchnie są przetwarzane przez RampantFixed.

[dw-commands]
reset-harvesters=Usuwa i odtwarza wszystkie niezniszczalne obiekty z kopalni, przywracając ich domyślne ustawienia. Zwykłe obiekty pozostają bez zmian. Po uruchomieniu tego polecenia kopalnie zostaną wycofane.
reset-platform=Usuwa i odtwarza wszystkie niezniszczalne obiekty z platformy teleportacyjnej, przywracając jej domyślne ustawienia. Zwykłe obiekty pozostają bez zmian. Ostrzeżenie: powoduje to usunięcie skrzyń powierzchniowych, więc możesz stracić przedmioty.

[dw-randomizer]
aquilo-ammoniacal=Rozległe oceany amoniaku dominują na horyzoncie, a ich opary unoszą się falami. Planeta wydaje się niestabilna i obca.
aquilo-barren=Ta planeta jest całkowicie martwa. Krajobraz rozciąga się w ciszy, zamarznięty i pusty, a pod stopami nie ma nic poza lodem i amoniakiem.
aquilo-concentrated=Jeden surowiec dominuje w zamarzniętym krajobrazie w przytłaczającej obfitości, podczas gdy wszystkie inne niemal zniknęły.
aquilo-dry-ice=Mroźne wiatry przetaczają się przez niekończące się zamarznięte równiny. Suchy lód pokrywa wszystko, a zmierzch wiecznie unosi się w zimnym powietrzu.
aquilo-normal=Zimno przenika każdą powierzchnię, a krajobraz lśni szronem. Przetrwanie tutaj oznacza znalezienie ciepła pośród zamarzniętej ciszy.
fulgora-barren=Wydaje się, że nikt tu nigdy nie był.
fulgora-death-world=Śmierć czai się w każdym cieniu.
fulgora-dry=Tylko ciała stałe. Gdzie podziały się wszystkie ciecze?
fulgora-junkyard=Pozostałości starożytnej cywilizacji. Pozostały tylko śmieci i kąsacze.
fulgora-no-scrap=Starożytne ruiny rozsiane są po całym krajobrazie.
fulgora-normal=Nie ma tu nic szczególnego do oglądania, wszystko wygląda normalnie.
fulgora-oil-planet=Ogromne oceany czarnej ropy rozciągają się aż po horyzont.
gleba-fertile=Pola rozciągają się jak okiem sięgnąć, tętnią żyznością.
gleba-flooded=Woda pokrywa większość lądu. Przetrwały tylko najwytrzymalsze formy życia.
gleba-nest=Ląd zdominowały gniazda pentapodów. Niebezpieczeństwo czai się wszędzie.
gleba-no-jellynut=Nigdzie nie widać gleby żeloorzecha. Brakuje czegoś istotnego.
gleba-no-yumako=Brakuje znanej zielonej pychotki. Krajobraz wydaje się niekompletny.
gleba-normal=Gleba jest żyzna, a powietrze tętni życiem. Tutaj wszystko rośnie.
neo-nauvis-alternate=Czegoś tu brakuje, ale nie do końca wiadomo czego.
neo-nauvis-amazonia=Gęste dżungle, bogate zasoby i czające się niebezpieczeństwa. Witaj w Amazonii.
neo-nauvis-barren=Nic poza piaskiem i kamieniami. W zasięgu wzroku nie widać ani jednego surowca.
neo-nauvis-concentrated=Jeden surowiec dominuje w krajobrazie w przytłaczającej obfitości, podczas gdy wszystkie inne niemal zniknęły.
neo-nauvis-death-barren=Świat jest całkowicie ogołocony, pozostały tylko ruiny i wrogie stworzenia.
neo-nauvis-death-island=Wyspa pełna kąsaczy, odizolowana i bezlitosna.
neo-nauvis-death-world=Kąsacze roją się wszędzie. Niebezpieczeństwo czai się za każdym cieniem.
neo-nauvis-lonely-island=Odizolowana wyspa, odcięta od świata i jego bogactw.
neo-nauvis-normal=Wydaje się, że znasz tę planetę...
vulcanus-alternate=Coś jest nie tak. Brakuje niektórych zasobów, ale nie potrafisz określić, których.
vulcanus-barren=Popiół i pył rozciągają się jak okiem sięgnąć. Nic tu nie rośnie.
vulcanus-concentrated=Jeden surowiec dominuje w wulkanicznym krajobrazie, występując w ogromnych ilościach, podczas gdy wszystkie inne niemal całkowicie zniknęły.
vulcanus-death-world=Po wulkanicznych pustkowiach roi się od kąsaczy i niszczycieli. Przetrwanie jest odległą nadzieją.
vulcanus-demolisher=Ziemia jest pokryta bliznami po potężnych niszczycielach. Poruszaj się ostrożnie.
vulcanus-dormant=Wulkany ucichły. Ziemia jest spokojna, ale pod powierzchnią wciąż może czaić się niebezpieczeństwo.
vulcanus-erupting=Podłoga jest lawą.
vulcanus-normal=Ziemia dudni pod twoimi stopami, ale krajobraz wydaje się dziwnie normalny.

